name: Build & Release APK

on:
  push:
    branches: [main]
  tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering and triggering from other workflows

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using user-provided keystore secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No keystore secrets found. Generating a self-signed keystore..."
            keytool -genkeypair -v -keystore release-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass my-password -keypass my-password -dname "CN=VoiceKeyboard, OU=None, O=None, L=None, S=None, C=US"
            echo "KEYSTORE_PASSWORD=my-password" >> $GITHUB_ENV
            echo "KEY_ALIAS=my-alias" >> $GITHUB_ENV
            echo "KEY_PASSWORD=my-password" >> $GITHUB_ENV
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
        run: ./gradlew assembleRelease

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceKeyboard-${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Voice Keyboard ${TAG_NAME}"
          else
            TAG_NAME="latest"
            RELEASE_TITLE="Voice Keyboard Latest Build"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.title }}
          prerelease: false # Always stable so Obtainium tracks it automatically!
          make_latest: "true"
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of the Voice Keyboard.
            
            - **App Version**: ${{ steps.version.outputs.name }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Date (UTC)**: ${{ github.event.head_commit.timestamp || 'Just now' }}
          generate_release_notes: false

