name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering and triggering from other workflows

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Signing secrets missing ($missing); this pull request build stays unsigned."
              exit 0
            fi
            # A release built without the repository keystore would be signed with a
            # throwaway key and could never be updated over an installed build.
            echo "::error::Signing secrets missing:$missing. Refusing to publish an APK signed with a throwaway key."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release-keystore.p12"
          echo "Signing keystore ready."

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | tr -d ':' | tr 'A-F' 'a-f' | sort -u)
          KS_FP=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/release-keystore.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' | tr 'A-F' 'a-f')

          echo "keystore certificate : $KS_FP"
          echo "APK signer certificate: $APK_FP"
          if [ -z "$APK_FP" ] || [ "$APK_FP" != "$KS_FP" ]; then
            echo "::error::APK is not signed with the repository signing keystore."
            exit 1
          fi

          {
            echo "### APK signature"
            echo ""
            echo "- certificate SHA-256: \`$APK_FP\`"
            echo "- matches the repository signing keystore"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceKeyboard-${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Voice Keyboard ${TAG_NAME}"
          else
            TAG_NAME="latest"
            RELEASE_TITLE="Voice Keyboard Latest Build"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.title }}
          prerelease: false # Always stable so Obtainium tracks it automatically!
          make_latest: "true"
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of the Voice Keyboard.
            
            - **App Version**: ${{ steps.version.outputs.name }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Date (UTC)**: ${{ github.event.head_commit.timestamp || 'Just now' }}
          generate_release_notes: false

