name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can merge

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/rustemar/voice-keyboard.git
          git fetch upstream main

      - name: Record SHA
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Merge Upstream
        run: |
          # Try to merge upstream/main.
          # If there is a merge conflict, we will resolve it by keeping our customized method.xml.
          git merge upstream/main -m "chore: sync with upstream" || {
            echo "Merge conflict detected. Resolving method.xml conflict automatically..."
            if git status --porcelain | grep -E '^U.*method.xml'; then
              git checkout --ours app/src/main/res/xml/method.xml
              git add app/src/main/res/xml/method.xml
            fi
            git add .
            git commit -m "chore: sync with upstream and resolve conflicts"
          }

      - name: Apply Voice Keyboard Attributes
        run: |
          chmod +x scripts/apply_ime_attributes.py
          python3 scripts/apply_ime_attributes.py

      - name: Push and Detect Changes
        id: post
        run: |
          BEFORE_SHA="${{ steps.pre.outputs.sha }}"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: automatically re-apply voice keyboard attributes"
          fi
          AFTER_SHA=$(git rev-parse HEAD)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No new changes to push."
            git push origin main || echo "Already up to date."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Build
        if: steps.post.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
